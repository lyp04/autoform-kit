plugins {
    id "com.android.application"
}

def gitHead = "unknown"
try {
    // Bind runtime diagnostics to the App subtree, not the commit object. A commit id also changes
    // when release-only provenance metadata is finalized; embedding it in classes.dex would then
    // change the compiled baseline profile that the same metadata must hash, creating a circular
    // and non-reproducible release input. The App tree id still changes for every source, resource,
    // manifest, dependency declaration, or App test change under app/.
    def proc = ["git", "rev-parse", "HEAD:app"].execute(
        null, rootProject.projectDir)
    proc.waitFor()
    if (proc.exitValue() == 0) {
        gitHead = proc.text.trim()
    }
} catch (Exception ignored) {
}

android {
    namespace "com.autoformkit.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.autoformkit.app"
        minSdk 23
        targetSdk 35
        versionCode = (project.findProperty("versionCode") ?: "9").toInteger()
        versionName = (project.findProperty("versionName") ?: "1.0.8-beta.1").toString()

        buildConfigField "String", "GIT_HEAD", "\"" + gitHead + "\""
        buildConfigField "boolean", "AUTO_UPDATE_ENABLED", "true"
        buildConfigField "boolean", "CROSS_APP_SESSION_ENABLED", "true"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"   // install alongside the production release; never overwrite it / its data
            versionNameSuffix "-debug"
            buildConfigField "boolean", "AUTO_UPDATE_ENABLED", "false"
            buildConfigField "boolean", "CROSS_APP_SESSION_ENABLED", "false"
        }
    }

    sourceSets {
        main {
            manifest.srcFile "AndroidManifest.xml"
            java.srcDirs = ["src"]
            res.srcDirs = ["res"]
            assets.srcDirs = ["assets"]
        }
        test {
            java.srcDirs = ["test"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        checkReleaseBuilds true
        abortOnError true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"

    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
    implementation "com.google.zxing:core:3.5.3"

    implementation "com.google.mlkit:barcode-scanning:17.3.0"
    implementation "com.google.mlkit:text-recognition:16.0.1"

    implementation "androidx.exifinterface:exifinterface:1.4.2"
    implementation "androidx.camera:camera-camera2:1.5.3"
    implementation "androidx.camera:camera-lifecycle:1.5.3"
    implementation "androidx.camera:camera-view:1.5.3"
}
